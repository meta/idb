name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository or its releases; artifacts within a
# run need no extra permission.
permissions:
  contents: read

jobs:
  python-client:
    name: Python client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    steps:
      - uses: actions/checkout@v5
      # The runner image leaves Spotlight on. Nothing here searches with it,
      # and its indexer competes for CPU with everything the job writes.
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fb-idb from source
        run: FB_IDB_VERSION=0.0.0 pip install .
      - name: Smoke test the CLI
        run: idb --help
      - name: Run unit tests
        # The suites ship inside the package as *_tests.py, which pytest's
        # default discovery pattern does not match. Run outside the checkout:
        # from the repo root the source idb/ tree — which lacks the generated
        # gRPC modules — shadows the installed package and breaks collection.
        working-directory: ${{ runner.temp }}
        run: |
          pip install pytest
          python -m pytest --pyargs idb -o python_files='*_tests.py'

  pure-python:
    name: Pure Python tests (no simulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test build script dependency guards
        run: bash tests/build-test.sh "$PWD"
      - name: Test the CI scripts
        run: python -m unittest discover -s CI -p '*_tests.py' -t . -v
      - name: Test the benchmark checks
        run: python -m unittest discover -s Benchmarks -p '*_tests.py' -t . -v
      # Run separately because e2e discovery matches test*.py.
      - name: Test the end-to-end harnesses
        run: |
          python -m unittest \
            EndToEndTests.harness_tests \
            EndToEndTests.documentation_tests \
            EndToEndTests.accessibility_tests \
            -v
      - name: Check the documentation's links into the repository
        run: python -m CI.check_documentation_links
      - name: Test homebrew.py
        run: python -m unittest homebrew_tests -v

  mac-libraries:
    name: Build libraries (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The runner image leaves Spotlight on. Nothing here searches with it,
      # and its indexer competes for CPU with everything the job writes.
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Build libraries
        run: ./build.sh build libraries
      # Every product's size, and each linked image's by module, in the job log
      # and the run summary, so a size change shows up on the commit that made it.
      - name: Report binary sizes
        # An explicit bash runs with pipefail, so a failed report fails the step
        # rather than passing as tee's success.
        shell: bash
        # The whole of Build/Products, whatever configuration the build used; each row
        # names it.
        run: python3 -m CI.binary_sizes --title "Libraries" Build/Products | tee -a "$GITHUB_STEP_SUMMARY"
      # The libraries as consumers take them: an XCFramework per library, the
      # private frameworks' module maps and stubs, the resources, and the manifest
      # of what each library links and needs. The Release workflow publishes this
      # tarball when it is cut at a commit CI built.
      - name: Package the libraries
        run: |
          ./build.sh build library-package
          tar -C Build/LibraryPackage -czf idb-libraries.macos-arm64.tar.gz .
          shasum -a 256 idb-libraries.macos-arm64.tar.gz | tee idb-libraries.macos-arm64.tar.gz.sha256
          # One zip per XCFramework, as a SwiftPM binary target fetched by URL takes it,
          # with the checksums a Package.swift names them by.
          python3 -m CI.xcframework_zips Build/LibraryPackage xcframeworks
      - name: Upload the libraries
        uses: actions/upload-artifact@v5
        with:
          name: idb-libraries
          path: |
            idb-libraries.macos-arm64.tar.gz*
            xcframeworks/
      # The raw xcodebuild output build.sh keeps for every invocation; the
      # formatted job log shows only what the formatter recognised.
      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: libraries-xcodebuild-logs
          path: Build/Logs/xcodebuild/*.log
          if-no-files-found: ignore
          retention-days: 14

  # One job per test target, each a signal of its own, so a Unit regression,
  # a broken boot and a broken guest read are three signals rather than one.
  # `TestPlan.json` is generated from the Buck graph, so a new test target
  # joins the matrix without being named here.
  mac-test-plan:
    name: Plan macOS tests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: python3 -m CI.test_plan matrix >> "$GITHUB_OUTPUT"

  # Each job runs on the runner its plan entry names: a larger one for a suite
  # that encodes with the hardware video encoder or drives a simulator, as the
  # end-to-end shards do, and the standard one otherwise.
  mac-tests:
    name: Test ${{ matrix.name }} (macOS)
    needs: mac-test-plan
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 60
    env:
      # xcodebuild only forwards TEST_RUNNER_-prefixed variables into the test
      # process; the in-test environment gates (XCTSkipIf on GITHUB_ACTIONS)
      # never see the job env without this.
      TEST_RUNNER_GITHUB_ACTIONS: 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mac-test-plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v5
      # The runner image leaves Spotlight on. Nothing here searches with it,
      # and its indexer competes for CPU with everything the job writes.
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true
      # The companion's test bundles generate the gRPC sources first, which needs
      # protoc and the codegen plugins the companion build caches.
      - name: Install tools
        run: brew install xcodegen xcbeautify ${{ matrix.codegen && 'protobuf' || '' }}
      - name: Cache protoc plugins
        if: matrix.codegen
        uses: actions/cache@v5
        with:
          path: |
            Build/Codegen
          key: protoc-plugins-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ runner.os }}
      # A suite that takes a booted simulator from its environment does not
      # boot one itself, so this job is the harness that supplies it, named by
      # DEVICE_UDID (forwarded through xcodebuild's TEST_RUNNER_ prefix).
      - name: Provision a simulator
        if: matrix.bootedSimulator
        run: python3 -m CI.provision_simulator --name smoke-test-provided --env-prefix TEST_RUNNER_ >> "$GITHUB_ENV"
      - name: Test ${{ matrix.target }}
        run: ./build.sh test ${{ matrix.target }}
      # Hosted runners otherwise yield nothing beyond a failing test's name;
      # the result bundle carries per-test failure detail and, for tests
      # killed by the time allowance, a snapshot of where they were stuck.
      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}-xcresult
          path: Build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
      # The raw xcodebuild output build.sh keeps for every invocation; the
      # formatted job log shows only what the formatter recognised.
      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}-xcodebuild-logs
          path: Build/Logs/xcodebuild/*.log
          if-no-files-found: ignore
          retention-days: 14

  # SimScope builds as any consumer of the libraries would: against this commit's
  # libraries package, taking its SwiftPM products, and bundling this commit's
  # companion distribution, both as the jobs that built them uploaded them. So
  # every commit shows an app building and running from the package alone.
  simscope:
    name: Build SimScope from the libraries package (macOS, experimental)
    runs-on: macos-26
    timeout-minutes: 30
    needs: [mac-libraries, mac-companion]
    env:
      XCODEGEN_STRIP_XATTRS: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - uses: actions/download-artifact@v5
        with:
          name: idb-libraries
          path: artifacts/libraries
      - uses: actions/download-artifact@v5
        with:
          name: idb-companion-distribution
          path: artifacts/companion
      - name: Unpack the libraries package and the distribution
        run: |
          mkdir -p "$RUNNER_TEMP/LibraryPackage"
          tar -C "$RUNNER_TEMP/LibraryPackage" -xzf artifacts/libraries/idb-libraries.macos-arm64.tar.gz
          tar -C "$RUNNER_TEMP" -xzf artifacts/companion/idb-companion-distribution.tgz
      - name: Build the standalone app
        env:
          IDB_LIBRARY_PACKAGE: ${{ runner.temp }}/LibraryPackage
          IDB_DISTRIBUTION: ${{ runner.temp }}/Distribution
        run: ./build.sh build simscope
      - name: Smoke test the archived app
        run: |
          ditto -x -k Build/SimScope-macos-arm64.zip "$RUNNER_TEMP/simscope-download"
          SIMSCOPE_APP="$RUNNER_TEMP/simscope-download/SimScope.app" python3 Tools/SimScope/smoke_test.py -v
      - name: Upload SimScope app
        uses: actions/upload-artifact@v5
        with:
          name: SimScope-experimental-macos-arm64
          path: Build/SimScope-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: simscope-xcodebuild-logs
          path: Build/Logs/xcodebuild/*.log
          if-no-files-found: ignore
          retention-days: 14

  # A larger runner, because the build is compile-bound and the end-to-end
  # shards and formulae wait on it.
  mac-companion:
    name: Build companion + distribution (macOS)
    runs-on: macos-26-xlarge
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The runner image leaves Spotlight on. Nothing here searches with it,
      # and its indexer competes for CPU with everything the job writes.
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true
      - name: Install tools
        run: brew install xcodegen protobuf xcbeautify
      # build.sh compiles both protoc plugins from source on first run;
      # cache those builds to keep this job fast. The checkout directories carry
      # the pinned version, so the glob picks up whichever one the pin names.
      - name: Cache protoc plugins
        uses: actions/cache@v5
        with:
          path: |
            Build/Codegen
          key: protoc-plugins-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ runner.os }}
      - name: Build everything and assemble the distribution
        run: ./build.sh build all
      - name: Report binary sizes
        # See the libraries job: pipefail keeps a failed report from passing.
        shell: bash
        run: python3 -m CI.binary_sizes --title "Distribution" --configuration Release Build/Distribution | tee -a "$GITHUB_STEP_SUMMARY"
      # The raw xcodebuild output build.sh keeps for every invocation; the
      # formatted job log shows only what the formatter recognised.
      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: companion-xcodebuild-logs
          path: Build/Logs/xcodebuild/*.log
          if-no-files-found: ignore
          retention-days: 14
      # Archived first: artifact upload does not keep file modes, and the
      # end-to-end job has to execute what it downloads.
      - name: Archive the distribution
        run: tar -C Build -czf idb-companion-distribution.tgz Distribution
      - name: Upload distribution
        uses: actions/upload-artifact@v5
        with:
          name: idb-companion-distribution
          path: idb-companion-distribution.tgz
      # The same tree packaged exactly as the Release workflow's companion
      # asset (flat, archive root = Distribution/), so the formulae job below
      # can install it through the real formula, and so a release cut at this
      # commit can ship these bytes instead of rebuilding them.
      - name: Package the companion as the release asset
        run: |
          tar -C Build/Distribution -czf idb-companion.macos-arm64.tar.gz .
          shasum -a 256 idb-companion.macos-arm64.tar.gz | tee idb-companion.macos-arm64.tar.gz.sha256
      - name: Upload the companion asset
        uses: actions/upload-artifact@v5
        with:
          name: idb-companion
          path: idb-companion.macos-arm64.tar.gz*

  # The formulae, rendered from .github/formulae/ against this commit's own
  # companion tarball and wheel and installed through Homebrew from those
  # local files. A template that no longer matches the tarball layout, a
  # dependency pin that stopped resolving, or an install block that breaks
  # fails here, on the diff that caused it, instead of on release day. The
  # rendered files and the wheel are uploaded alongside the idb-companion
  # artifact. The formulae's URLs point at this runner, so installing them
  # elsewhere means downloading all three and repointing the URLs at them,
  # which is what homebrew.py at the repository root does.
  mac-formulae:
    name: Render and install the formulae (macOS)
    runs-on: macos-26
    needs: mac-companion
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The runner image leaves Spotlight on. Nothing here searches with it,
      # and its indexer competes for CPU with everything the job writes.
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the companion asset
        uses: actions/download-artifact@v5
        with:
          name: idb-companion
          path: assets
      # v0.0.0 is a well-formed tag for the render; the wheel must carry the
      # same version so its filename matches the one the formulae reference.
      - name: Build the wheel
        run: |
          pip install build
          FB_IDB_VERSION=0.0.0 python -m build --wheel --outdir assets
      - name: Render the formulae against the local assets
        run: |
          python3 .github/scripts/tap_formulae.py render \
            --tag v0.0.0 \
            --companion 'assets/idb-companion.macos-arm64.tar.gz' \
            --wheel 'assets/fb_idb-*-py3-none-any.whl' \
            --asset-base "file://$PWD/assets" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out tap
      - name: Upload the rendered formulae
        uses: actions/upload-artifact@v5
        with:
          name: formulae
          path: tap/
      - name: Upload the wheel
        uses: actions/upload-artifact@v5
        with:
          name: fb-idb-dist
          path: assets/fb_idb-*-py3-none-any.whl
          if-no-files-found: error
      - name: Mount the render as the meta/fb tap
        run: |
          taps="$(brew --repository)/Library/Taps/meta"
          mkdir -p "$taps"
          ln -s "$PWD/tap" "$taps/homebrew-fb"
          brew tap-info meta/fb
      # Homebrew only trusts the formula named on the command line; the
      # dependencies it pulls from the same untrusted tap are refused. Trust
      # the scratch tap as a whole so `idb` can bring in idb-cli and
      # idb-companion.
      - name: Trust the scratch tap
        run: brew trust meta/fb
      # idb depends on the other two, so one install exercises all three
      # formulae; a source install of idb-cli is the venv-and-pip path that a
      # release bottle would skip, which is exactly what should be checked.
      - name: Install from the local assets
        run: brew install meta/fb/idb
      - name: Test the installed formulae
        run: brew test meta/fb/idb-companion meta/fb/idb-cli meta/fb/idb

  # Each shard gets its own runner and simulator, apart from `install`, whose
  # companion targets the Mac; `CI.end_to_end_shard` says which modules it runs. A larger runner, because on the standard 3-core, 7 GB
  # VM the simulator stalls for tens of seconds at a time and outlasts test waits.
  mac-end-to-end:
    name: End-to-end ${{ matrix.shard }} (idb through idb_companion, macOS)
    runs-on: macos-26-xlarge
    needs: mac-companion
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [demos, ui, system, apps, install]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fb-idb from source
        run: FB_IDB_VERSION=0.0.0 pip install .
      - name: Download the distribution
        uses: actions/download-artifact@v5
        with:
          name: idb-companion-distribution
      # Unpacked outside the checkout. `pip install .` above leaves setuptools'
      # lowercase `build/` in it, and on the runner's case-insensitive
      # filesystem a `Build` beside it is that same directory -- so the
      # distribution would land under one spelling while the paths exported
      # below name the other. Every host-side check accepts either; a
      # simulator's `launchd_sim` resolves a program path case-sensitively and
      # refuses the spelling it was not given.
      - name: Unpack the distribution
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          tar -C "$RUNNER_TEMP/artifacts" -xzf idb-companion-distribution.tgz
      # The runner image leaves Spotlight on, and its indexer takes more than a
      # core while the freshly booted simulator and the tests are running.
      # Nothing here searches with Spotlight. The `.noindex` suffix below keeps
      # the device set out of the index even if this step fails.
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true
      # Export DEVICE_UDID and DEVICE_SET_PATH for a dedicated simulator.
      - name: Provision a simulator
        if: matrix.shard != 'install'
        run: python3 -m CI.provision_simulator --name end-to-end-provided --device-set "$RUNNER_TEMP/end-to-end-device-set.noindex" >> "$GITHUB_ENV"
      # Fail if a required simulator host service is unavailable. Record H.264
      # rather than the default HEVC: this run's video is what the website
      # publishes, and it is the encoding every browser decodes.
      - name: Run the end-to-end suite
        run: |
          IDB_BIN="$(command -v idb)" \
          IDB_E2E_COMPANION_PATH="$RUNNER_TEMP/artifacts/Distribution/idb_companion" \
          IDB_E2E_RECORDER_PATH="$RUNNER_TEMP/artifacts/Distribution/sim-video" \
          IDB_E2E_REPL_PATH="$RUNNER_TEMP/artifacts/Distribution/idb-repl" \
          IDB_E2E_ARTIFACTS_DIR="$RUNNER_TEMP/end-to-end-diagnostics" \
          IDB_E2E_RECORDER_ENCODING=h264 \
          IDB_E2E_STRICT=1 \
          python -m unittest -v --durations 0 $(python3 -m CI.end_to_end_shard ${{ matrix.shard }})
      # Only a run in which every documented demo passed produces this, so the
      # artifact's existence is what lets the site publish them. The recorder
      # that captured the run is also what cuts each demo's clip out of it.
      # Every demo is in the `demos` shard, and nothing else is.
      - name: Document the demos this run performed
        if: matrix.shard == 'demos'
        run: python3 -m CI.generate_documentation --artifacts-dir "$RUNNER_TEMP/end-to-end-diagnostics" --output "$RUNNER_TEMP/documentation" --recorder "$RUNNER_TEMP/artifacts/Distribution/sim-video"
      - name: Upload the demo documentation
        if: matrix.shard == 'demos'
        uses: actions/upload-artifact@v5
        with:
          name: documentation
          path: ${{ runner.temp }}/documentation
      - name: Collect diagnostics
        if: always()
        run: python3 -m CI.collect_diagnostics --artifacts-dir "$RUNNER_TEMP/end-to-end-diagnostics" --output "$RUNNER_TEMP/end-to-end-diagnostics"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: end-to-end-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/end-to-end-diagnostics
            !${{ runner.temp }}/end-to-end-diagnostics/*-idb-output.log
          if-no-files-found: ignore
          retention-days: 14
      # Everything each idb exec printed, apart from the video so it can be
      # fetched and grepped on its own.
      - name: Upload idb output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: idb-output-${{ matrix.shard }}
          path: ${{ runner.temp }}/end-to-end-diagnostics/*-idb-output.log
          if-no-files-found: ignore
          retention-days: 14

  website:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test the demos generator
        run: yarn test-scripts
      # No run to document here, which is what a plain checkout builds.
      - name: Build the site
        run: yarn build

  # The same site built from the demos the end-to-end run documented, so a
  # manifest the website cannot render fails here rather than on deployment.
  # This job's conclusion is what deployment checks. It runs even when another
  # shard failed: the `documentation` artifact only exists when every demo
  # passed, so downloading it is the gate on the demos.
  website-demos:
    name: Build the website from the end-to-end run
    runs-on: ubuntu-latest
    needs: mac-end-to-end
    if: ${{ !cancelled() && needs.mac-end-to-end.result != 'skipped' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the demo documentation
        uses: actions/download-artifact@v5
        with:
          name: documentation
          path: documentation
      - name: Build the site with this run's demos
        working-directory: website
        env:
          IDB_DEMOS_DIR: ${{ github.workspace }}/documentation
        run: |
          yarn install --frozen-lockfile
          yarn build
