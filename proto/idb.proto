syntax = "proto3";

package idb;

// The idb companion service definition.
service CompanionService {
  // Management
  rpc connect(ConnectRequest) returns (ConnectResponse) {}
  rpc debugserver(stream DebugServerRequest)
      returns (stream DebugServerResponse) {}
  rpc dap(stream DapRequest) returns (stream DapResponse) {}
  rpc forward_port(stream ForwardPortRequest)
      returns (stream ForwardPortResponse) {}
  rpc describe(TargetDescriptionRequest) returns (TargetDescriptionResponse) {}
  rpc install(stream InstallRequest) returns (stream InstallResponse) {}
  rpc log(LogRequest) returns (stream LogResponse) {}
  rpc xctrace_record(stream XctraceRecordRequest)
      returns (stream XctraceRecordResponse) {}
  rpc profile(stream ProfileRequest) returns (stream ProfileResponse) {}
  // Interaction
  rpc accessibility_info(AccessibilityInfoRequest)
      returns (AccessibilityInfoResponse) {}
  rpc accessibility_action(AccessibilityActionRequest)
      returns (AccessibilityActionResponse) {}
  rpc accessibility_quiescence(AccessibilityQuiescenceRequest)
      returns (stream AccessibilityQuiescenceResponse) {}
  rpc focus(FocusRequest) returns (FocusResponse) {}
  rpc get_orientation(GetOrientationRequest) returns (GetOrientationResponse) {}
  rpc set_orientation(SetOrientationRequest) returns (SetOrientationResponse) {}
  rpc hinge_angle(HingeAngleRequest) returns (HingeAngleResponse) {}
  rpc hid(stream HIDEvent) returns (HIDResponse) {}
  rpc open_url(OpenUrlRequest) returns (OpenUrlRequest) {}
  rpc set_location(SetLocationRequest) returns (SetLocationResponse) {}
  rpc send_notification(SendNotificationRequest)
      returns (SendNotificationResponse) {}
  rpc delivered_notifications(DeliveredNotificationsRequest)
      returns (DeliveredNotificationsResponse) {}
  rpc clear_delivered_notifications(ClearDeliveredNotificationsRequest)
      returns (ClearDeliveredNotificationsResponse) {}
  rpc simulate_memory_warning(SimulateMemoryWarningRequest)
      returns (SimulateMemoryWarningResponse) {}
  // Settings
  rpc approve(ApproveRequest) returns (ApproveResponse) {}
  rpc revoke(RevokeRequest) returns (RevokeResponse) {}
  rpc clear_keychain(ClearKeychainRequest) returns (ClearKeychainResponse) {}
  rpc contacts_update(ContactsUpdateRequest) returns (ContactsUpdateResponse) {}
  rpc contacts_clear(ContactsClearRequest) returns (ContactsClearResponse) {}
  rpc photos_clear(PhotosClearRequest) returns (PhotosClearResponse) {}
  rpc lock_screen(LockScreenRequest) returns (LockScreenResponse) {}
  rpc setting(SettingRequest) returns (SettingResponse) {} // Sets settings
  rpc get_setting(GetSettingRequest) returns (GetSettingResponse) {
  } // Gets current setting
  rpc list_settings(ListSettingRequest) returns (ListSettingResponse) {
  } // Lists available settings
  // App
  rpc launch(stream LaunchRequest) returns (stream LaunchResponse) {}
  rpc list_apps(ListAppsRequest) returns (ListAppsResponse) {}
  rpc terminate(TerminateRequest) returns (TerminateResponse) {}
  rpc uninstall(UninstallRequest) returns (UninstallResponse) {}
  // Video/Audio
  rpc add_media(stream AddMediaRequest) returns (AddMediaResponse) {}
  rpc inject_audio(stream InjectAudioRequest) returns (InjectAudioResponse) {}
  rpc inject_video(stream InjectVideoRequest)
      returns (stream InjectVideoResponse) {}
  rpc record(stream RecordRequest) returns (stream RecordResponse) {}
  rpc screenshot(ScreenshotRequest) returns (ScreenshotResponse) {}
  rpc video_stream(stream VideoStreamRequest)
      returns (stream VideoStreamResponse) {}
  // Crash Operations
  rpc crash_delete(CrashLogQuery) returns (CrashLogResponse) {}
  rpc crash_list(CrashLogQuery) returns (CrashLogResponse) {}
  rpc crash_show(CrashShowRequest) returns (CrashShowResponse) {}
  // xctest operations
  rpc xctest_list_bundles(XctestListBundlesRequest)
      returns (XctestListBundlesResponse) {}
  rpc xctest_list_tests(XctestListTestsRequest)
      returns (XctestListTestsResponse) {}
  rpc xctest_run(XctestRunRequest) returns (stream XctestRunResponse) {}
  rpc repl(stream ReplRequest) returns (stream ReplResponse) {}
  // File Operations
  rpc ls(LsRequest) returns (LsResponse) {}
  rpc mkdir(MkdirRequest) returns (MkdirResponse) {}
  rpc mv(MvRequest) returns (MvResponse) {}
  rpc rm(RmRequest) returns (RmResponse) {}
  rpc pull(PullRequest) returns (stream PullResponse) {}
  rpc push(stream PushRequest) returns (PushResponse) {}
  rpc tail(stream TailRequest) returns (stream TailResponse) {}
}

// One RPC opens one connection to the companion's selected physical device.
// The first request must be Open. Subsequent requests are opaque byte chunks,
// each at most 64 KiB. Client stream completion flushes accepted writes and
// starts a bounded response drain before closing the device connection.
message ForwardPortRequest {
  message Open {
    uint32 port = 1; // 1...65535
  }
  oneof event {
    Open open = 1;
    bytes data = 2;
  }
}

message ForwardPortResponse {
  message Opened {}
  // Opened acknowledges a successful device connection. Response stream
  // completion ends the connection. Empty data is not EOF.
  // Final non-OK status means the connection failed;
  // interrupted connections must not be automatically reopened or replayed.
  oneof event {
    Opened opened = 1;
    bytes data = 2;
  }
}

message GetOrientationRequest {}

message GetOrientationResponse {
  enum Orientation {
    UNKNOWN = 0;
    PORTRAIT = 1;
    PORTRAIT_UPSIDE_DOWN = 2;
    LANDSCAPE_LEFT = 3;
    LANDSCAPE_RIGHT = 4;
    FACE_UP = 5;
    FACE_DOWN = 6;
  }
  // Physical device orientation, independent of application interface rotation.
  Orientation orientation = 1;
}

message SetOrientationRequest {
  // Physical landscape directions; legacy HID orientation encoding is
  // unchanged.
  HIDEvent.HIDOrientationType orientation = 1;
}

message SetOrientationResponse {}

message HingeAngleRequest {}

message HingeAngleResponse {
  // A fresh measured hinge angle in degrees, from 0 (closed) to 180 (flat).
  double angle = 1;
}

message Payload {
  oneof source {
    string file_path = 1;
    bytes data = 2;
    string url = 3;
    // Declares how the payload that follows is compressed. It is a frame of
    // its own, sent before that payload; without one the payload is GZIP.
    Compression compression = 4;
  }
  enum Compression {
    GZIP = 0;
    ZSTD = 1;
  }
}

message ProcessOutput {
  enum Interface {
    STDOUT = 0;
    STDERR = 1;
  }
  Interface interface = 1;
  bytes data = 2;
}

message CompanionInfo {
  string udid = 1;
  bool is_local = 4;
  bytes metadata = 6;
  // The compressions the companion can extract an app stream from. Companions
  // that predate this field leave it empty, and only extract GZIP.
  repeated Payload.Compression supported_compressions = 7;
  // Whether the companion can install a zstd compressed zip app stream. The
  // stream starts with a zstd skippable frame whose magic is 0x184D2A5E and
  // whose 8 byte content is "idb-zip\0", which tells it apart from a
  // compressed tar. Companions without this must be sent the zip as is.
  bool zstd_zip_streams = 8;
  // The destinations whose stream the companion reads as a zip, or as a zstd
  // compressed zip if zstd_zip_streams is set, telling it apart from a tar by
  // its first bytes. Companions that predate this field leave it empty, and
  // read only an app stream as a zip.
  repeated InstallRequest.Destination zip_stream_destinations = 9;
  // Whether the companion accepts InstallRequest.connect_to with a url
  // payload. Companions without it reject an install stream that carries one.
  bool install_connect_to = 10;
  // Whether local notification delivery can invoke the application's service
  // extension. Clients must reject that mode when this capability is absent.
  bool supports_notification_service_extension = 11;
  // Understands ScreenshotRequest.include_app_context and returns an explicit
  // observation context, including UNAVAILABLE when this target cannot observe
  // it. Absent on older peers; clients must not infer app identity from an
  // absent response.
  bool screenshot_app_context = 12;
}

enum Setting {
  LOCALE = 0;
  ANY = 1; // any kind of app or global setting
}

message SettingRequest {
  message HardwareKeyboard {
    bool enabled = 1;
  }
  message StringSetting {
    Setting setting = 1;
    string value = 2;
    string name = 3; // iff setting == ANY
    string domain = 4; // assumed "Apple Global Domain" if empty
    /*
     * Currently supported value_types and corresponding values are:
     *  string <string_value>
     *  data <hex_digits>
     *  int[eger] <integer_value>
     *  float  <floating-point_value>
     *  bool[ean] (true | false | yes | no)
     *  date <date_rep>
     *  array <value1> <value2> ...
     *  array-add <value1> <value2> ...
     *  dict <key1> <value1> <key2> <value2> ...
     *  dict-add <key1> <value1> ...
     *
     * Check defaults set help for more details.
     */
    string value_type = 5;
  }
  oneof setting {
    HardwareKeyboard hardwareKeyboard = 1;
    StringSetting stringSetting = 2;
  }
}

message SettingResponse {}

message GetSettingRequest {
  Setting setting = 1;
  string name = 2; // iff setting == ANY
  string domain = 3; // assumed "Apple Global Domain" if empty
}

message GetSettingResponse {
  string value = 1;
}

message ListSettingRequest {
  Setting setting = 1;
}

message ListSettingResponse {
  repeated string values = 1;
}

message ListAppsRequest {
  bool suppress_process_state = 1;
}

message ListAppsResponse {
  repeated InstalledAppInfo apps = 1;
}

message InstalledAppInfo {
  string bundle_id = 1;
  string name = 2;
  repeated string architectures = 3;
  string install_type = 4;
  enum AppProcessState {
    UNKNOWN = 0;
    NOT_RUNNING = 1;
    RUNNING = 2;
  }
  AppProcessState process_state = 5;
  bool debuggable = 6;
  uint64 process_identifier = 7;
}

message InstallRequest {
  enum Destination {
    APP = 0;
    XCTEST = 1;
    DYLIB = 2;
    DSYM = 3;
    FRAMEWORK = 4;
  }
  message LinkDsymToBundle {
    enum BundleType {
      APP = 0;
      XCTEST = 1;
    }
    BundleType bundle_type = 1;
    string bundle_id = 2;
  }
  // Where to open a url payload's connection instead of the address its host
  // resolves to, as curl's --connect-to does. The url's host is still the name
  // TLS verifies the server against and the HTTP Host it asks for.
  message ConnectTo {
    // A host name, or an IPv4 or IPv6 address without brackets.
    string host = 1;
    // 1 to 65535.
    uint32 port = 2;
  }
  // 5 was `bundle_id`, the form link_dsym_to_bundle replaced.
  reserved 5;
  reserved "bundle_id";
  // An install is a stream of frames: the destination first, then each option
  // at most once, then the payload. A data payload continues across as many
  // frames as it needs. The compression frame counts as an option.
  //
  // Current companions accept the options in any order and reject a repeated
  // one. Older companions accept only this order: name_hint, make_debuggable,
  // override_modification_time, skip_signing_bundles, link_dsym_to_bundle,
  // compression. Clients send that order so they work with either, with
  // connect_to just before compression.
  //
  // connect_to is accepted only with a url payload. A companion that predates
  // it rejects the stream instead of ignoring the option.
  oneof value {
    Destination destination = 1;
    Payload payload = 2;
    string name_hint = 3;
    bool make_debuggable = 4;
    LinkDsymToBundle link_dsym_to_bundle = 6;
    bool override_modification_time = 7;
    bool skip_signing_bundles = 8;
    ConnectTo connect_to = 9;
  }
}

message InstallResponse {
  // Set on the final response, once the artifact is installed.
  string name = 1;
  string uuid = 2;
  // An intermediate response: how much of a URL install's download has
  // arrived, as a whole-number percentage from 0 to 100. Only rises, and only
  // sent for apps whose download states its length; clients treat any response
  // with a name as the installed artifact.
  double progress = 3;
}

message ScreenshotRequest {
  enum Format {
    PNG = 0;
    JPEG = 1;
    TIFF = 2;
  }
  // The unit that `crop` and `fit` are expressed in. POINTS is the coordinate
  // space that tap, swipe and describe already use; it is resolved to pixels
  // on the companion, which is the only side that knows the screen scale.
  enum Unit {
    PIXELS = 0;
    POINTS = 1;
  }
  // Top-left origin, matching the tap/swipe coordinate space. A rect that
  // partially overhangs the screen is clamped; the response reports the
  // dimensions actually captured.
  message Rect {
    double x = 1;
    double y = 2;
    double width = 3;
    double height = 4;
  }
  // Bounding box the image is scaled to fit inside. One factor is applied to
  // both axes and the image is never upscaled, so the aspect ratio is
  // preserved to within the rounding of each side to a whole pixel -- a few
  // percent on a very small image. 0 means "unbounded" on that axis; when both
  // are set, the more restrictive bound wins.
  message Fit {
    uint32 max_width = 1;
    uint32 max_height = 2;
  }

  Format format = 1;
  // Lossy formats only; 0 means "server default" (0.8), as in
  // VideoStreamRequest. Setting this on PNG or TIFF is an INVALID_ARGUMENT
  // error rather than a no-op.
  double compression_quality = 2;
  // Unset captures the full screen.
  Rect crop = 3;
  // Transforms are applied crop -> scale -> encode, so the scaler never
  // touches pixels that are about to be discarded.
  oneof scale {
    // In (0, 1].
    double scale_factor = 4;
    Fit fit = 5;
  }
  Unit unit = 6;
  // Opt-in observations from this screenshot attempt. Unset performs no app
  // observations. Older companions ignore this and omit app_context.
  bool include_app_context = 7;
}

message ScreenshotResponse {
  // Pixels. A measurement is never legitimately 0, so 0 on either axis is the
  // companion saying it did not report one rather than an image of no height.
  message Size {
    uint32 width = 1;
    uint32 height = 2;
  }

  bytes image_data = 1;
  // One of "png", "jpeg" or "tiff". Declared since this message was written
  // but never populated before the request gained fields. A companion that
  // leaves this empty predates that change and has silently ignored every
  // field of ScreenshotRequest.
  string image_format = 2;
  // Dimensions of image_data, after crop and scale.
  Size destination = 3;
  // Dimensions of the native capture, before crop and scale.
  Size source = 4;
  // Pixels per point, so a client can convert between the two units itself.
  // 0 when the target does not report a screen scale, which is also when a
  // request in POINTS is rejected.
  double screen_scale = 5;
  // Absent unless requested and understood by the companion. This context is
  // descriptive evidence, never a certificate of the pixels' application or
  // source.
  ScreenshotAppContext app_context = 6;
}

message ScreenshotAppObservation {
  string app_name = 1;
  string bundle_id = 2;
  // Read from the installed bundle, not from the running executable or source
  // tree.
  string installed_build_uuid = 3;
  uint64 process_id = 4;
  int64 observed_at_ms = 5;
}

message ScreenshotAppContext {
  uint32 version = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    // Matching samples around capture do not exclude a switch away and back,
    // process-id reuse, bundle replacement, or a source reload during capture.
    MATCHING_OBSERVATIONS = 1;
    UNAVAILABLE = 2;
  }
  State state = 2;
  // Empty for matching observations. Otherwise one of: unsupported_target,
  // display_unavailable, foreground_unavailable, app_unavailable,
  // build_unavailable, context_changed.
  string reason = 3;
  string target_udid = 4;
  // The display identified by capture, empty when capture could not name it.
  string display_id = 5;
  int64 capture_started_at_ms = 6;
  int64 capture_finished_at_ms = 7;
  ScreenshotAppObservation before = 8;
  ScreenshotAppObservation after = 9;
}

message FocusRequest {}

message FocusResponse {}

message Point {
  double x = 1;
  double y = 2;
}

message AccessibilityInfoRequest {
  enum Format {
    LEGACY = 0;
    NESTED = 1;
    // A consolidated document: the element tree plus the read's provenance
    // (which backend served it, what was asked, screen bounds, truncation,
    // any blocking modal). An older server does not recognize this value and
    // falls back to LEGACY — a caller can detect that by the response shape.
    COMPLETE = 2;
  }
  // Which backend serves the read. UNSPECIFIED preserves the historical
  // behaviour, so an older client — or one that does not ask — is unaffected;
  // an older server ignores this field entirely and serves the read as if it
  // were unset.
  enum Backend {
    BACKEND_UNSPECIFIED = 0;
    AX = 1;
    AXBRIDGE = 2;
    AXBRIDGE_PERSISTENT = 3;
    // The host translation sent through CoreSimulator's own accessibility
    // client rather than idb's connection to CoreSimulatorBridge. An older
    // server does not recognize it and serves the read as if it were unset.
    AX_CORESIMULATOR = 4;
  }
  Point point = 2;
  Format format = 3;
  // Optional: describe a single element by marker (substring match against
  // match_key, within depth) instead of by point / the whole screen.
  string marker = 4;
  AccessibilityActionRequest.SearchableKey match_key = 5;
  uint32 depth = 6;
  // Restricts the described accessibility keys to this set; an empty list
  // returns the default key set.
  repeated string keys = 7;
  Backend backend = 8;
  // Collect element counts and timings for the read. Reported by the COMPLETE
  // format only; the legacy formats collect but have nowhere to report, so
  // their output is unchanged.
  bool profile = 9;
  // Collect upper-region frame coverage for the read. Reported by the
  // COMPLETE format only, like profile.
  bool collect_frame_coverage = 10;
  // Which elements the read reports. FILTER_ALL is the historical behaviour,
  // so an older client — or one that does not ask — is unaffected.
  enum Filter {
    FILTER_ALL = 0;
    // Only the elements a caller could actually interact with.
    FILTER_INTERACTABLE = 1;
  }
  // Report only the elements whose match_key value contains this substring;
  // empty reports every element, which is the historical behaviour. Unlike
  // marker, which selects the first matching element and only it, match
  // reports all of them and finding none is an empty result rather than an
  // error. Setting both marker and match is INVALID_ARGUMENT.
  string match = 11;
  // Compare match — and, on a marker read, marker — case-insensitively.
  bool ignore_case = 12;
  Filter filter = 13;
  // The assistive client the read claims to be, which decides what the
  // application answers with: the automation tree (every container and
  // identifier, as XCUITest sees it) for the automation clients, the flattened
  // tree VoiceOver reads for the rest. UNSPECIFIED claims no client, the
  // historical behaviour, so an older client is unaffected; an older server
  // ignores this field. These numbers are not the accessibility translator's
  // own values; the companion maps each one by name.
  enum ClientType {
    CLIENT_TYPE_UNSPECIFIED = 0;
    CLIENT_TYPE_NO_CLIENT = 1;
    CLIENT_TYPE_UNIDENTIFIED = 2;
    // Automation clients.
    CLIENT_TYPE_APPLICATION = 3;
    CLIENT_TYPE_XCODE_HELPER = 4;
    CLIENT_TYPE_XCTEST = 5;
    CLIENT_TYPE_SCRIPTER = 6;
    CLIENT_TYPE_SYSTEM_EVENTS = 7;
    // Assistive technologies.
    CLIENT_TYPE_VOICE_OVER = 8;
    CLIENT_TYPE_SWITCH_CONTROL = 9;
    CLIENT_TYPE_FULL_KEYBOARD_ACCESS = 10;
    CLIENT_TYPE_VOICE_CONTROL = 11;
    CLIENT_TYPE_ACCESSIBILITY_INSPECTOR = 12;
  }
  ClientType client_type = 14;
}

message AccessibilityInfoResponse {
  string json = 1;
}

message AccessibilityActionRequest {
  enum SearchableKey {
    LABEL = 0;
    UNIQUE_ID = 1;
    VALUE = 2;
    TITLE = 3;
    ROLE = 4;
    ROLE_DESCRIPTION = 5;
    SUBROLE = 6;
    HELP = 7;
    PLACEHOLDER = 8;
  }
  // No target means the frontmost application element.
  oneof target {
    string marker = 1;
    Point point = 2;
  }
  SearchableKey match_key = 3;
  uint32 depth = 4;
  // Compare a marker — the source and, on a drag, the destination —
  // case-insensitively. Absent on an older client, which matches
  // case-sensitively as before.
  bool ignore_case = 9;
  // Which backend serves the action, for every action including wait.
  // UNSPECIFIED preserves the historical behaviour, so an older client — or
  // one that does not ask — is unaffected; an older server ignores this field
  // entirely and acts as if it were unset.
  AccessibilityInfoRequest.Backend backend = 11;

  message Tap {
    bool check_expected_value = 1;
    string expected_value = 2;
    SearchableKey expected_key = 3;
  }

  message Scroll {
    enum Direction {
      UP = 0;
      DOWN = 1;
      LEFT = 2;
      RIGHT = 3;
      VISIBLE = 4;
    }
    Direction direction = 1;
  }

  message SetValue {
    string value = 1;
  }

  // Press and hold the request's target, drag to the destination below, and
  // release. All durations are in seconds; a zero value means the server
  // default noted against each field.
  message Drag {
    // A destination is required; unlike the source, it has no frontmost
    // default.
    oneof destination {
      string marker = 1;
      Point point = 2;
    }
    SearchableKey destination_match_key = 3;
    uint32 destination_depth = 4;
    // How long to hold the source before moving. Default 0.5.
    double press_duration = 5;
    // How long the movement itself takes. Default 0.5.
    double duration = 6;
    // How long to hold the destination before releasing. Default 0.1.
    double release_duration = 7;
    // Distance between interpolated touch points, in points. Default 10.
    double delta = 8;
  }

  message Wait {
    double timeout = 1;
    double poll_interval = 2;
    // Superseded by AccessibilityActionRequest.backend, which every action
    // shares. Still read when that field is unset, so a client older than it
    // keeps selecting a backend for wait.
    AccessibilityInfoRequest.Backend backend = 3 [ deprecated = true ];
  }

  oneof action {
    Wait wait = 10;
    Tap tap = 5;
    Scroll scroll = 6;
    SetValue set_value = 7;
    Drag drag = 8;
  }
}

message AccessibilityActionResponse {
  enum WaitResult {
    UNSPECIFIED = 0;
    FOUND = 1;
    TIMED_OUT = 2;
  }
  WaitResult wait_result = 1;

  message WaitResponse {
    WaitResult result = 1;
    string message = 2;
    // Absent when the backend does not supply diagnostics. An empty message
    // with no read_error means the final read found no values for the key.
    WaitDiagnostics diagnostics = 3;
  }
  // New companions populate both fields. Clients use wait_result when wait
  // is absent, as it is on older companions.
  WaitResponse wait = 2;

  message WaitDiagnostics {
    // Nonmatching values of the searched key from the final poll only.
    repeated string unmatched_values = 1;
    // Legacy aggregate: the sample OR tree read was truncated. Retained for
    // older clients; use the separate flags below to judge search completeness.
    bool truncated = 2;
    string read_error = 3;
    // Present, even when false, when the backend reports tree completeness.
    // Absent on older companions or backends that cannot report it.
    optional bool read_truncated = 4;
    // New companions explicitly populate this flag, even when false. Absent
    // on older companions that supply only the ambiguous legacy aggregate.
    optional bool sample_truncated = 5;
  }
}

// Streams an application's quiescence until the client cancels or the
// application exits. Simulator targets only.
message AccessibilityQuiescenceRequest {
  // What measures the application.
  enum Backend {
    // AXBRIDGE, the only backend of a companion that predates this field.
    BACKEND_UNSPECIFIED = 0;
    // The accessibility runtime's idle notifications, read by the guest
    // accessibility reader.
    AXBRIDGE = 1;
    // The idle capability of the Shimulator shim, inside an app launched
    // through idb with IDB_IDLE_SYNC=1 in its environment. The busy threshold
    // is the shortest main-thread work that makes the app busy. With no
    // target, measures the one armed app connected.
    SHIMULATOR = 2;
  }
  // No target follows the frontmost application.
  oneof target {
    uint64 pid = 1;
    string bundle_id = 2;
  }
  // Each tunable is in its own oneof for presence, since zero is a meaningful
  // value: unset takes the companion's default.
  oneof busy_threshold {
    // How long a signal may go unanswered before the application is busy.
    uint32 busy_threshold_ms = 3;
  }
  oneof quiet_window {
    // How long every signal must stay answered before the application is
    // quiet.
    uint32 quiet_window_ms = 4;
  }
  Backend backend = 5;
}

message AccessibilityQuiescenceResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    BUSY = 1;
    SETTLING = 2;
    QUIET = 3;
  }
  enum Signal {
    SIGNAL_UNSPECIFIED = 0;
    RUN_LOOP_IDLE = 1;
    ANIMATIONS_INACTIVE = 2;
    // No scroll view is moving its content. SHIMULATOR backend only.
    SCROLL_IDLE = 3;
    // The app accepts touches and key presses. SHIMULATOR backend only.
    INTERACTION_ENABLED = 4;
  }
  // Sent once the state is known and then on every change.
  message StateChanged {
    State state = 1;
    // The signals that have gone unanswered; set only when BUSY.
    repeated Signal busy_signals = 2;
  }
  // A touch sequence finished. Informational: it does not change the state.
  message TouchesCompleted {}
  // A stream following the frontmost application moved to pid. Its state
  // starts over.
  message TargetChanged {}
  // The application exited. The last response of the stream.
  message TargetExited {}

  // The application the event is about.
  uint64 pid = 1;
  oneof event {
    StateChanged state = 2;
    TouchesCompleted touches_completed = 3;
    TargetChanged target_changed = 4;
    TargetExited target_exited = 5;
  }
  // The backend that measured the event. BACKEND_UNSPECIFIED from a companion
