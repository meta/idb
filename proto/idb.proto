message RecordRequest {
  // Field names and numbers match VideoStreamRequest.Start, so the two read
  // identically; 3 is skipped because that is the stream's `format` and a
  // recording is always H.264 in an mp4. A zero value means the default noted
  // against each field, since a proto3 scalar cannot distinguish unset from
  // zero. A companion older than these fields ignores them and records at the
  // defaults; see RecordResponse.Applied.
  message Start {
    // 3 is the stream's `format`, deliberately skipped here (see above).
    // Reserve the tag and name so no future field can silently reuse them and
    // collide with a wire-compatible client that ever sent a `format` value.
    reserved 3;
    reserved "format";
    string file_path = 1;
    // Capture cadence. Default 30 -- unlike the stream, whose default is the
    // display's own rate. This is what FBSimulatorVideoRecordingCommands has
    // always pinned, so an all-zero request records exactly as it did before.
    uint64 fps = 2;
    // Inert for H.264 and so not offered by the CLI; here for message
    // symmetry. Must be in [0, 1], and cannot be combined with avg_bitrate.
    double compression_quality = 4;
    // Scale applied before encoding. Only a value in (0, 1) scales; default
    // unset, which records at full size. Values above 1 are rejected.
    double scale_factor = 5;
    // Target average bits per second. Default unset, which lets the encoder
    // choose.
    double avg_bitrate = 6;
    // Maximum seconds between forced key frames. Default 4.
    double key_frame_rate = 7;
    // Also record what the simulator's apps play, as an AAC track in the
    // recording. Only apps launched through idb are captured: launching
    // arms them, and they keep nothing until a recording asks. A companion
    // that cannot record audio for the target fails the request. One older
    // than this field ignores it: its Applied, if sent, has `audio` false,
    // and no Audio follows the recording.
    bool audio = 8;
  }
  message Stop {}
  oneof control {
    Start start = 1;
    Stop stop = 2;
  }
}

message RecordResponse {
  // The encode options the companion resolved for this recording, so a client
  // can tell that they took effect. Unset fps/scale_factor/key_frame_rate are
  // reported as the defaults they resolved to. The rate control is reported in
  // whichever of avg_bitrate/compression_quality the request chose, and both
  // are 0 when it chose neither and left the rate automatic.
  message Applied {
    uint64 fps = 1;
    double scale_factor = 2;
    double avg_bitrate = 3;
    double key_frame_rate = 4;
    double compression_quality = 5;
    // True when the companion is recording audio for this request.
    bool audio = 6;
  }
  // One process whose sound is in a recording's audio.
  message AudioProcess {
    int32 pid = 1;
    string name = 2;
    // Frames of its output in the audio.
    uint64 frames = 3;
    // Frames it played but could not keep, or -1 when it exited during the
    // recording without saying.
    int64 dropped_frames = 4;
    // Frames it played at a rate other than the audio's, left out.
    uint64 unmixed_frames = 5;
    // Times its audio was moved back onto the host clock after its device
    // clock drifted.
    uint64 realignments = 6;
  }
  // What a recording's audio holds.
  message Audio {
    // Seconds from the recording's start to the first captured frame,
    // negative when the audio began first and that much was cut.
    double offset = 1;
    // Frames of audio in the recording's track.
    uint64 frames = 2;
    double sample_rate = 3;
    // A two-channel, 32-bit float WAV of everything captured, uncut, written
    // beside a recording saved to the request's file_path. Empty when the
    // recording is sent back as data, or when nothing played.
    string wav_file_path = 4;
    repeated AudioProcess processes = 5;
    // What a process reported when it could not capture.
    repeated string failures = 6;
  }
  oneof output {
    bytes log_output = 1;
    Payload payload = 2;
    // Sent once, before any payload, and only when the request set at least
    // one encode option or asked for audio. A client that set one and did
    // not receive this is talking to a companion that silently dropped it.
    Applied applied = 3;
    // Sent once, after a recording with audio stops and before its payload.
    Audio audio = 4;
  }
}

